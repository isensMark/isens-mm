<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>저택 살인사건 — 진행 화면 (GM)</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#14101B;--deep:#0D0A12;--panel:#1D1726;--panel2:#251E31;
  --line:#362C46;--line2:#4A3C5E;
  --ink:#F2ECE1;--dim:#A99CB8;--mut:#6F6480;
  --violet:#A98AE0;--violetd:#6C4FA3;
  --gold:#C9A253;--wine:#C4544A;--blue:#6FA3C4;--green:#7FA86B;
  --serif:'Nanum Myeongjo','Batang',serif;
  --sans:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;
  overflow-x:hidden;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 60% at 50% -10%,rgba(108,79,163,.26),transparent 62%)}

/* ══ 상단 ══ */
.hdr{position:relative;z-index:2;display:flex;align-items:center;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);background:rgba(13,10,18,.7)}
.hdr .bd{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--violet)}
.hdr .bd span{color:var(--mut)}
.hdr .st{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--mut)}
.prog{height:3px;background:var(--deep);position:relative;z-index:2}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--violetd),var(--violet));
  width:0;transition:width .6s}

main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;
  max-width:960px;width:100%;margin:0 auto;padding:26px 22px 24px}

/* ══ 화면 공통 ══ */
.scr{display:none;flex:1;flex-direction:column;animation:fade .3s ease}
.scr.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--violet);margin-bottom:14px}

/* ══ 인트로 ══ */
.titleimg{width:min(460px,84%);height:auto;display:block;margin:0 auto 22px;
  filter:invert(1) hue-rotate(180deg) brightness(1.06) contrast(1.04);opacity:.94}
.intro{text-align:center;justify-content:center}
.intro .series{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--violet);margin-bottom:22px}
.intro h1{font-family:var(--serif);font-weight:800;font-size:clamp(44px,11vw,86px);
  line-height:1.02;letter-spacing:-.03em;margin-bottom:18px}
.intro h1 em{display:block;font-style:normal;color:var(--violet)}
.intro .tag{font-family:var(--serif);font-size:clamp(15px,2.4vw,19px);color:var(--dim)}
.specs{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:34px 0 30px}
.specs div{text-align:center}
.specs dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--mut);margin-bottom:5px}
.specs dd{font-family:var(--serif);font-size:22px;font-weight:700}
.cast4{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.cast4 span{font-family:var(--serif);font-size:15px;border:1px solid var(--line2);
  border-radius:99px;padding:7px 17px;color:var(--dim)}

/* ══ 프롤로그 ══ */
.book{background:linear-gradient(168deg,#221A2D,#191322);
  border:1px solid var(--line);border-left:3px solid var(--violetd);border-radius:5px;
  padding:clamp(24px,4vw,42px);font-family:var(--serif);
  font-size:clamp(16px,2.5vw,23px);line-height:1.95;color:#E6DCEF;flex:1;overflow-y:auto}
.book p+p{margin-top:1.1em;text-indent:1em}
.book .btitle{font-family:var(--serif);font-weight:800;font-size:1.35em;
  color:var(--violet);margin-bottom:.7em;letter-spacing:-.02em}
.book p:first-of-type::first-letter{font-size:2.6em;font-weight:800;color:var(--violet);
  float:left;line-height:.86;margin:.08em .18em 0 0}
.book .ptl{list-style:none;margin-top:1.6em;padding-left:70px;font-family:var(--sans)}
.book .ptl li{position:relative;padding-bottom:16px;border-left:1px solid var(--line2)}
.book .ptl li:last-child{border-left-color:transparent;padding-bottom:0}
.book .ptl li::before{content:'';position:absolute;left:-5px;top:9px;width:9px;height:9px;
  border-radius:50%;background:var(--bg);border:2px solid var(--line2)}
.book .ptl li time{position:absolute;left:-70px;top:0;width:52px;text-align:right;
  font-family:var(--mono);font-size:.62em;color:var(--dim)}
.book .ptl li span{display:block;padding-left:18px;font-size:.66em;color:var(--ink);line-height:1.6}
.book .ptl li.fin::before{background:var(--wine);border-color:var(--wine)}
.book .ptl li.fin span{color:var(--wine);font-weight:600}
.book .ptl li.fin time{color:var(--wine)}

/* ══ 라운드 ══ */
.round{justify-content:center;text-align:center}
.rnum{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--mut);margin-bottom:10px}
.rname{font-family:var(--serif);font-weight:800;font-size:clamp(34px,8vw,62px);
  letter-spacing:-.03em;line-height:1.1;margin-bottom:10px}
.rdesc{font-size:clamp(14px,2.2vw,18px);color:var(--dim);margin-bottom:26px}
.timer{font-family:var(--mono);font-weight:700;font-size:clamp(66px,20vw,150px);
  line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-bottom:8px}
.timer.warn{color:var(--gold)}
.timer.last{color:var(--wine)}
.next{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.1em;margin-bottom:26px}
.script{border:1px solid var(--line);background:var(--panel);border-radius:12px;
  padding:18px 22px;max-width:660px;margin:0 auto 24px;text-align:left}
.script .sl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--violet);margin-bottom:8px}
.script p{font-family:var(--serif);font-size:clamp(15px,2.2vw,18px);color:#DFD6EA;line-height:1.85}
.rname.vote{color:var(--gold)}
.warrant{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2);text-align:center}
.warrant .wl{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  color:var(--mut);margin-bottom:6px}
.warrant b{font-family:var(--mono);font-size:clamp(30px,7vw,46px);font-weight:600;
  letter-spacing:.28em;color:var(--gold)}
.script.vote{border-color:rgba(201,162,83,.42);background:rgba(201,162,83,.06)}
.script.vote .sl{color:var(--gold)}

/* ══ 버튼 ══ */
.btns{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
button{cursor:pointer;font-family:var(--sans);transition:.16s;border:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.b1{background:var(--violet);color:#1A1023;font-family:var(--serif);font-weight:800;
  font-size:clamp(16px,2.4vw,19px);border-radius:11px;padding:15px 42px}
.b1:hover{filter:brightness(1.08)}
.b1:active{transform:scale(.985)}
.b2{background:transparent;border:1px solid var(--line2);color:var(--dim);
  font-size:14px;border-radius:10px;padding:13px 22px}
.b2:hover{color:var(--ink);border-color:var(--violet)}
.b3{background:transparent;border:1px solid var(--line);color:var(--mut);
  font-size:12.5px;border-radius:8px;padding:9px 15px}
.b3:hover{color:var(--dim);border-color:var(--line2)}
.b3.hot{border-color:rgba(201,162,83,.5);color:var(--gold)}

/* ══ 도구 바 ══ */
.tools{position:relative;z-index:2;border-top:1px solid var(--line);background:rgba(13,10,18,.75);
  padding:11px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--mut);margin-right:4px}
.tools .sp{margin-left:auto}

/* ══ 모달 ══ */
.mbg{position:fixed;inset:0;z-index:60;background:rgba(9,6,13,.8);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:.22s}
.mbg.on{opacity:1;pointer-events:auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);z-index:61;
  width:min(560px,calc(100vw - 36px));max-height:82vh;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:26px 24px;opacity:0;pointer-events:none;transition:.24s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-family:var(--serif);font-size:23px;font-weight:800;margin-bottom:6px}
.modal .sub{font-size:13px;color:var(--mut);margin-bottom:18px}
.opts{display:grid;gap:7px;margin-bottom:16px}
.opt{text-align:left;background:var(--deep);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;color:var(--dim);font-size:14px;display:flex;align-items:center;gap:10px;width:100%}
.opt:hover{border-color:var(--violet);color:var(--ink)}
.opt.picked{border-color:var(--violet);background:rgba(169,138,224,.1);color:var(--ink)}
.opt .r{margin-left:auto;font-family:var(--mono);font-size:11px}
.opt .r.bad{color:var(--green)}
.opt .r.good{color:var(--wine)}
.hintbox{border:1px solid rgba(201,162,83,.35);background:rgba(201,162,83,.06);
  border-radius:10px;padding:15px 17px;font-family:var(--serif);font-size:17px;
  color:var(--gold);line-height:1.85;margin-bottom:14px}

/* ══ 진상 ══ */
.reveal{justify-content:center}
.rvcount{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mut);
  text-align:center;margin-bottom:16px}
.rvcard{border:1px solid var(--line);background:var(--panel);border-radius:14px;
  padding:clamp(24px,4vw,40px);max-width:760px;margin:0 auto 26px;width:100%}
.rvcard.big{border-color:var(--wine);background:rgba(196,84,74,.08)}
.rvcard .kk{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--violet);margin-bottom:12px}
.rvcard.big .kk{color:var(--wine)}
.rvcard h2{font-family:var(--serif);font-weight:800;font-size:clamp(26px,5.5vw,44px);
  line-height:1.2;letter-spacing:-.025em;margin-bottom:14px}
.rvcard.big h2{color:var(--wine)}
.rvcard p{font-size:clamp(14px,2.2vw,17px);color:#DCD3E6;margin-bottom:10px}
.rvcard p:last-child{margin-bottom:0}
.rvcard .quote{font-family:var(--serif);font-style:italic;color:var(--gold);
  border-left:2px solid rgba(201,162,83,.5);padding-left:16px;margin:14px 0}
.steps3{display:grid;gap:9px;margin-top:14px}
.steps3 div{display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:15px;
  background:var(--deep);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.steps3 b{font-family:var(--mono);font-size:11px;color:var(--violet)}
.poison{display:grid;gap:7px;margin-top:14px}
.poison div{display:grid;grid-template-columns:76px 1fr;gap:12px;font-size:14px;
  background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:10px 13px;color:var(--dim)}
.poison b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.poison.cul div{border-color:rgba(196,84,74,.45);background:rgba(196,84,74,.08)}
.poison.cul b{color:var(--wine)}

.toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,16px);z-index:70;
  background:var(--violet);color:#1A1023;font-size:13.5px;font-weight:600;
  padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.24s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* ── 캐릭터 QR ── */
#s-intro .qrbox{margin:0!important}
.qrlab{font-size:12.5px;font-weight:700;color:#8b8296;margin-bottom:8px;text-align:center}
.qrgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qrc{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:5px;font-family:inherit}
.qrc svg{width:100%;height:auto;border-radius:8px;display:block;
  background:#fff;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.qrc span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#a98ae0}
.qrc:active svg{transform:scale(.97)}
.qrwarn{margin-top:9px;font-size:11.5px;line-height:1.55;color:#e0a04a;text-align:center}
.qrpop{text-align:center}
.qrpop svg{width:min(60vh,420px);height:auto;background:#fff;padding:12px;border-radius:14px}
.qrurl{font-family:var(--mono);font-size:13px;color:#8b8296;margin:14px 0 16px;word-break:break-all}
.qrpop .b1{width:100%}

/* ══ 화면 넘침 대응 ══
   원칙 1) 한 화면에 들어가도록 최대한 압축한다
   원칙 2) 그래도 넘치면 반드시 스크롤이 생기게 한다 (버튼이 잘리지 않도록) */
main{overflow-y:auto!important;overflow-x:hidden}
.scr.on{max-height:none}

/* 라운드 화면 — 세로 여유가 적을 때 단계적으로 압축 */
.round{padding:8px 0 0!important}
.round .rnum{margin-bottom:6px!important}
.round .rname{line-height:1.12!important}
.round .rdesc{margin-bottom:10px!important}
.round .timer{line-height:.95!important;margin:2px 0!important}
.round .next{margin:6px 0 12px!important}
.round .script{margin-bottom:14px!important}
.round .btns{padding-bottom:10px}

@media(max-height:900px){
  .round .timer{font-size:clamp(46px,9vw,86px)!important}
  .round .rname{font-size:clamp(28px,4.6vw,44px)!important}
  .round .script{padding:16px 20px!important}
  .rules div{padding:10px 13px!important}
  .rules .rt{font-size:16px!important}
  .rules .rdz{font-size:13.5px!important}
}
@media(max-height:800px){
  .round .timer{font-size:clamp(38px,7vw,66px)!important}
  .round .rname{font-size:clamp(24px,4vw,36px)!important}
  .round .rdesc{font-size:15px!important;margin-bottom:6px!important}
  .round .next{margin:4px 0 8px!important}
  .round .script p{font-size:15.5px!important}
  .rules{gap:6px!important}
  .rules div{padding:8px 12px!important}
  .rules .rt{font-size:15px!important}
  .rules .rdz{font-size:12.5px!important}
  .vrow{padding:9px 13px!important}
}
@media(max-height:720px){
  .round .rnum{display:none!important}
  .round .timer{font-size:clamp(32px,6vw,54px)!important}
  .rules .rdz{display:none!important}
}

/* 오프닝 규칙 5장 — 넓은 화면에서는 2열로 */
@media(min-width:900px){
  .rules{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .rules div:last-child{grid-column:1/-1}
  .round .script{max-width:820px!important}
}
@media(max-height:860px){
  .rules div{padding:9px 12px!important}
  .rules .ri{font-size:18px!important}
  .rules .rt{font-size:15.5px!important}
  .rules .rdz{font-size:12.5px!important;line-height:1.45}
}

/* 라운드 화면 미세 압축 — 32px 남짓의 넘침을 없앤다 */
@media(max-height:880px){
  .round .rdesc{margin-bottom:6px!important}
  .round .next{margin:4px 0 8px!important}
  .round .script{margin-bottom:10px!important;padding:15px 18px!important}
  .round .script .sl{margin-bottom:8px!important}
  .round .script p{margin-top:10px!important;line-height:1.6!important}
  .rules{margin-bottom:10px!important}
  .round .btns{padding-bottom:6px!important;gap:8px!important}
  .round .btns button{padding-top:14px!important;padding-bottom:14px!important}
}
@media(max-height:700px){
  .round .rdesc{display:none!important}
  .round .script{padding:12px 16px!important}
  .vnote{padding:11px 13px!important;font-size:14.5px!important}
}

/* 마지막 미세 조정 — 좁은 화면에서 남는 수십 px 제거 */
@media(max-width:1100px){
  .rules{grid-template-columns:1fr 1fr!important}
  .rules .rdz{font-size:12px!important;line-height:1.4!important}
  .rules div{padding:8px 11px!important}
  .round .script{padding:13px 16px!important;margin-bottom:9px!important}
}
@media(max-height:680px){
  .round .next{display:none!important}
  .round .timer{margin:0!important}
  .vrow{padding:8px 12px!important}
  .vn{font-size:16px!important}
  .vnote{font-size:14px!important;padding:10px 12px!important}
  .round .btns button{padding-top:12px!important;padding-bottom:12px!important}
}

/* 마지막 미세 조정 — 남은 5~30px 넘침 제거 */
@media(max-height:790px){
  .round .script{padding:13px 16px!important;margin-bottom:9px!important}
  .rules{gap:5px!important;margin-bottom:8px!important}
  .rules div{padding:7px 11px!important}
  .rules .rt{font-size:14.5px!important}
  .rules .ri{font-size:16px!important}
  .round .timer{margin:0!important}
  .round .btns button{padding-top:12px!important;padding-bottom:12px!important;font-size:16px!important}
}
@media(max-height:680px){
  .round .next{display:none!important}
  .vlist{gap:5px!important}
  .vrow{padding:7px 12px!important}
  .vn{font-size:16px!important}
  .vnote{padding:9px 12px!important;font-size:13.5px!important;line-height:1.5}
  .round .script{margin-bottom:7px!important}
}

.imgfail{background:rgba(224,160,74,.1);border:1px dashed rgba(224,160,74,.45);
  border-radius:14px;padding:26px 20px;text-align:center;font-size:14px;line-height:1.7;color:#e0a04a}
.imgfail b{font-family:var(--mono);font-size:13px;color:#f0c07a;display:inline-block;margin:6px 0}
.imgfail span{display:block;font-size:12.5px;color:#8b8296;margin-top:4px}

/* GM 배지가 안내문을 가려서 제거 */
.vu-gm .script::before{display:none!important}
.vu-gm .script{padding-left:22px!important;padding-top:18px!important}

.bgmbtn{background:rgba(169,138,224,.14);border:1px solid rgba(169,138,224,.3);
  color:#c9a7ff;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.bgmbtn:hover{background:rgba(169,138,224,.22)}
.bgmbtn.off{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:#6b6478}
</style>
<link rel="stylesheet" href="assets/visual-upgrade.css">
<style>
/* ══ 인트로: 좌 비주얼 / 우 정보 · 스크롤 없음 ══ */
main{overflow:hidden}
#s-intro.on{
  display:grid!important; grid-template-columns:minmax(0,1.28fr) minmax(320px,.72fr);
  gap:clamp(20px,3vw,44px); align-items:center; height:100%;
  padding:clamp(14px,2.4vh,26px) clamp(18px,3vw,40px)!important; overflow:hidden}
#s-intro .titleimg{display:none!important}
#s-intro .vu-gm-hero{grid-column:1;margin:0!important;height:100%;min-height:0;
  display:flex!important;align-items:flex-end!important;border-radius:18px;overflow:hidden}
#s-intro .vu-gm-hero .vu-gm-copy{padding:clamp(18px,3vh,34px)!important}
#s-intro .vu-gm-hero h2{font-size:clamp(26px,3.1vw,44px)!important;line-height:1.18!important;
  white-space:nowrap!important;margin:0 0 14px!important}
#s-intro .vu-gm-hero .vu-kicker{margin-bottom:10px!important}
#s-intro .vu-gm-hero .vu-facts{gap:7px!important}
#s-intro .vu-gm-hero .vu-facts span{padding:7px 12px!important;font-size:12px!important}
#s-intro .side{grid-column:2;display:flex;flex-direction:column;align-items:stretch;
  gap:clamp(10px,1.6vh,18px);min-width:0}
#s-intro .side .tag{margin:0!important;font-size:clamp(14px,1.5vw,17px);color:#b6adc4;text-align:left}
#s-intro .side .specs{margin:0!important;display:grid!important;grid-template-columns:repeat(3,1fr);
  gap:10px!important;text-align:left}
#s-intro .side .specs>div{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:11px 12px}
#s-intro .side .specs dt{font-size:11.5px!important;color:#8b8296!important;margin-bottom:3px!important}
#s-intro .side .specs dd{font-size:clamp(17px,1.9vw,22px)!important;font-weight:800!important;margin:0!important}
#s-intro .side .cast4{margin:0!important;display:flex!important;flex-wrap:wrap;gap:7px!important;
  justify-content:flex-start!important}
#s-intro .side .cast4 span{padding:7px 14px!important;font-size:13px!important}
#s-intro .side .roomcard{margin:0!important;display:block!important;width:100%;text-align:center;
  padding:clamp(10px,1.6vh,16px) 18px!important}
#s-intro .side .roomcard .c1{font-size:11.5px!important;margin-bottom:3px!important}
#s-intro .side .roomcard .c2{font-size:clamp(26px,3.4vw,40px)!important}
#s-intro .side .roomcard .c3{font-size:12px!important;margin-top:5px!important;line-height:1.5}
#s-intro .side .btns{margin:0!important;padding:0!important;background:none!important;
  position:static!important;display:block!important}
#s-intro .side .btns .b1{width:100%;font-size:clamp(17px,1.9vw,20px)!important;
  padding:clamp(14px,2vh,19px) 0!important}
@media(max-width:900px){
  #s-intro.on{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #s-intro .vu-gm-hero{grid-column:1;grid-row:1}
  #s-intro .side{grid-column:1;grid-row:2}
}

/* ── 진상 진입 게이트 ── */
.vu-gm #s-gate,#s-gate{display:none}
.vu-gm #s-gate.on,#s-gate.on{display:flex!important;height:100%!important;
  align-items:center!important;justify-content:center!important;text-align:center!important;
  flex-direction:column!important;padding:0!important}
#s-gate .gate-in{max-width:660px!important;width:100%;padding:0 24px;margin:0 auto!important;
  display:flex!important;flex-direction:column!important;align-items:center!important;
  text-align:center!important}
#s-gate .gate-k,#s-gate h2,#s-gate .gate-p,#s-gate .gate-warn,#s-gate .gate-btn{
  text-align:center!important;align-self:center!important}
#s-gate .gate-k{font-family:var(--mono);font-size:12.5px;letter-spacing:.28em;color:#a98ae0;margin:0 0 20px}
#s-gate h2{font-size:clamp(36px,5.6vw,54px)!important;font-weight:800!important;letter-spacing:-.04em;margin:0 0 18px!important;line-height:1.2}
#s-gate .gate-p{font-size:19px!important;line-height:1.85;color:#b6adc4!important;margin:0 0 26px!important}
#s-gate .gate-warn{display:inline-block;font-size:13.5px;font-weight:700;color:#e0a04a;
  background:rgba(224,160,74,.12);border-radius:99px;padding:9px 20px;margin:0 0 30px}
#s-gate .gate-btn{font-size:21px!important;padding:21px 52px!important;border-radius:16px!important}


/* ── 미공개 단서: 버튼 · 팝업 ── */
.unseen{margin-top:16px;text-align:center}
.unbtn{font-size:17px!important;padding:15px 28px!important;
  background:rgba(224,160,74,.14)!important;color:#f0c07a!important;
  border:1px solid rgba(224,160,74,.4)!important}
.unbtn b{font-family:var(--mono);margin-left:6px}
.unbtn:disabled{opacity:.4;cursor:default}
.unlog{font-size:12.5px;color:#8b8296;margin-top:10px;line-height:1.6}
.unpop{text-align:center}
.unpop .unk{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:#e0a04a;margin-bottom:12px}
.unpop h3{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
.unpop .unw{font-size:13px;color:#8b8296;font-weight:600;margin-bottom:16px}
.unpop p{font-size:18px;line-height:1.75;color:#cfc7da;margin-bottom:18px;text-align:left}
.unpop .unn{font-size:13px;color:#8b8296;margin-bottom:18px}
.unpop .b1{width:100%}


/* 투표 · 미공개 가독성 */
.script .vrow{padding:11px 15px}
.script .vn{font-size:18px}
.script .vc{font-size:16px}
.script .vnote{font-size:16px;padding:14px 16px}
.script .ui b{font-size:17px}
.script .ui .ud{font-size:15px}


/* ── 이식: 방코드 · 규칙 · 투표 · 미공개 단서 ── */
.hdr .room{display:flex;align-items:center;gap:8px}
.hdr .room .rcap{font-size:12px;font-weight:700;color:var(--g500)}
.hdr .room .rcap.off{color:var(--amber)}
.hdr .room b{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.16em;
  color:var(--blue);background:var(--blue-l);border-radius:8px;padding:3px 10px}
.roomcard{background:var(--w);border-radius:20px;box-shadow:var(--sh);
  padding:20px 30px;margin:0 auto 22px;display:inline-block}
.roomcard .c1{font-size:14px;font-weight:700;color:var(--g500);margin-bottom:6px}
.roomcard .c2{font-family:var(--mono);font-size:clamp(38px,8vw,54px);font-weight:700;
  letter-spacing:.2em;color:var(--blue);line-height:1}
.roomcard .c3{font-size:14px;color:var(--g500);font-weight:500;margin-top:10px}
.roomcard.off .c2{font-size:22px;letter-spacing:0;color:var(--amber)}
.rules{display:grid;gap:7px;margin-bottom:14px}
.rules{grid-template-columns:1fr 1fr}
.rules div:last-child{grid-column:1/-1}
.rules div{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;
  background:var(--g100);border-radius:12px;padding:11px 14px}
.rules .ri{font-size:22px;text-align:center;line-height:1}
.rules .rt{display:block;font-size:17px;font-weight:800;color:var(--g900);letter-spacing:-.02em}
.rules .rdz{display:block;font-size:14px;color:var(--g600);margin-top:2px;font-weight:500}
.rules?'게임 규칙':'진행 안내')}</div>`</style>

/* ══ 진상 나레이션 (assets/reveal-narration.mp3 · 197.4초) ══
   자막 체류 시간을 RV_SCALE 배로 늘려 오디오 길이에 맞춘다.
   REV_AT[] 은 각 슬라이드의 오디오 시작 시각(ms) — 실행 시 자동 계산.
   음성과 어긋나면 RV_AUDIO_MS 또는 REV_AT 를 직접 조정하세요. */
const RV_AUDIO_SRC='assets/reveal-narration.mp3';
const RV_AUDIO_MS=197424;
let RV_SCALE=1, REV_AT=[];
let revAudio=null;
function initRevAudio(){
  if(revAudio) return revAudio;
  revAudio=new Audio(RV_AUDIO_SRC); revAudio.preload='auto';
  return revAudio;
}
function calcRevealTiming(){
  RV_SCALE=1;
  // 자막 체류 시간에 하한이 있어 한 번으로는 안 맞는다. 몇 번 되풀이해 수렴시킨다.
  for(let n=0;n<6;n++){
    const sum=REVEAL.reduce((a,r,i)=>a+revealDuration(r,i),0);
    if(!sum) break;
    const err=RV_AUDIO_MS/sum;
    if(Math.abs(err-1)<0.002) break;
    RV_SCALE*=err;
  }
  const d=REVEAL.map((r,i)=>revealDuration(r,i));
  REV_AT=[]; let acc=0;
  d.forEach(x=>{ REV_AT.push(acc); acc+=x; });
  // 남은 오차는 마지막 슬라이드가 흡수한다
  REV_TOTAL=acc;
}
let REV_TOTAL=0;

function paintVote(){
  const r=ROUNDS[ri]; if(!r||!r.vote) return;
  const v=votes['v'+r.vote]||{};
  const tally={han:[],bak:[],yu:[],yun:[]};
  Object.entries(v).forEach(([who,target])=>{ if(tally[target]) tally[target].push(NAMES[who]); });
  const done=Object.keys(v).length;
  const rows=Object.keys(tally).sort((a,b)=>tally[b].length-tally[a].length);
  const min=Math.min(...rows.map(k=>tally[k].length));
  const zeros=rows.filter(k=>tally[k].length===min);
  const all=done>=4;
  $('#script').innerHTML=`<div class="gl">투표 · ${done} / 4 완료</div>
    <div class="vlist">${rows.map(k=>{
      const n=tally[k].length;

        <span class="vb">${'●'.repeat(n)||'　'}</span>
        <span class="vc">${n}표</span>
        <span class="vw">${tally[k].join(' · ')||''}</span></div>`;}).join('')}</div>
    ${!all?`<p style="text-align:center;color:var(--g500)">각자 휴대폰에서 지목해주세요</p>`
      : r.vote===1
      ? `<div class="vnote">가장 적게 지목받은 <b>${zeros.map(k=>NAMES[k]).join(' · ')}</b> 님이<br>

}

/* 아무도 찾지 못한 증거를 최종 변론에 자동 공개 */
let unseenPool=null, unseenShown=[];
function paintUnseen(){
  const box=$('#unseen'); if(!box) return;
  if(!ONLINE){ box.innerHTML=''; return; }
  roomRef('taken').once('value').then(s=>{
    const t=s.val()||{};
    unseenPool = Object.keys(ALLCLUE).filter(k=>!t[k] && !unseenShown.includes(k));
    renderUnseenBtn();
  }).catch(()=>{});
}
function renderUnseenBtn(){
  const box=$('#unseen'); if(!box) return;
  const left=(unseenPool||[]).length;
  if(!left && !unseenShown.length){ box.innerHTML=''; return; }
  box.innerHTML = `<div class="unseen">
    <button class="b2 unbtn" id="unGo" ${left?'':'disabled'}>
      ${left?`경찰이 추가로 확보한 증거 <b>${left}</b>`:'추가 증거를 모두 공개했습니다'}
    </button>
    ${unseenShown.length?`<div class="unlog">공개함 · ${unseenShown.map(k=>ALLCLUE[k].n).join(' · ')}</div>`:''}
  </div>`;
  const b=$('#unGo'); if(b && left) b.onclick=revealOneUnseen;
}
function revealOneUnseen(){
  if(!unseenPool || !unseenPool.length) return;
  const k = unseenPool.splice(Math.floor(Math.random()*unseenPool.length),1)[0];
  unseenShown.push(k);
  const c = ALLCLUE[k];
  openModal(`<div class="unpop">
      <div class="unk">경찰이 추가로 확보한 증거</div>
      <h3>${c.n}</h3>
      <div class="unw">${c.w}</div>
      <p>${c.d}</p>
      <div class="unn">아무도 찾지 못한 증거입니다. 소리 내어 읽어주세요.</div>
      <button class="b1" id="unClose">확인</button>
    </div>`);
  const cb=$('#unClose'); if(cb) cb.onclick=()=>{ closeModal(); renderUnseenBtn(); };
  renderUnseenBtn();
}

let pro=0, proMode='stopped', proElapsed=0, proStarted=0, proFinished=false;
let proTimers=[], proFrame=null;

/* ══ 프롤로그 나레이션 (assets/prologue-narration.mp3) ══
   장별 시작 오프셋. 실제 음성과 어긋나면 이 숫자만 조정하세요. */
const PRO_AT=[0,22608,50868,62172,89302];
let proAudio=null, proAudioReady=false;
function initProAudio(){
  if(proAudio) return proAudio;
  proAudio=new Audio('assets/prologue-narration.mp3');
  proAudio.preload='auto';
  proAudio.addEventListener('canplaythrough',()=>{proAudioReady=true;});
  proAudio.addEventListener('error',()=>{proAudioReady=false;});
  return proAudio;
}
function proAudioSync(){
  const a=initProAudio();
  const t=(PRO_AT[pro]+proElapsed)/1000;
  if(Math.abs(a.currentTime-t)>0.35){ try{ a.currentTime=t; }catch(e){} }
}
function proAudioPlay(){ const a=initProAudio(); proAudioSync(); a.play().catch(()=>{}); }
function proAudioPause(){ if(proAudio) proAudio.pause(); }
function proAudioStop(){ if(proAudio){ proAudio.pause(); try{proAudio.currentTime=0;}catch(e){} } }
function proDuration(P=PROLOGUE[pro]){ return P.durationMs||12000; }
function clearProClock(){
  proTimers.forEach(clearTimeout); proTimers=[];
  if(proFrame) cancelAnimationFrame(proFrame); proFrame=null;
}
function showProCaption(cue=null){
  const cap=$('#proCaption'), card=$('#book .pro-card'); if(!cap||!card)return;
  card.classList.remove('scream-on');cap.className='pro-caption';cap.replaceChildren();cap.removeAttribute('aria-label');

}
function showProTimeline(count=0){
  document.querySelectorAll('[data-pro-schedule]').forEach((item,i)=>item.classList.toggle('on',i<count));
}
function updateProControls(){

  play.setAttribute('aria-pressed',proMode==='playing'?'true':'false');
  play.textContent=proMode==='playing'?'Ⅱ 일시정지':proMode==='paused'?'▶ 계속 재생':proFinished?'↻ 처음부터 재생':'▶ 프롤로그 재생';

function paintPro(){

function runProScene(){
  clearProClock();
  const P=PROLOGUE[pro], total=proDuration(P);
  const a=initProAudio();
  const want=(PRO_AT[pro]+proElapsed)/1000;
  const seek=()=>{ if(Math.abs(a.currentTime-want)>0.3){ try{ a.currentTime=want; }catch(e){} } };
  if(a.readyState>=1) seek(); else a.addEventListener('loadedmetadata', seek, {once:true});
  a.play().catch(()=>{});
  proStarted=performance.now()-proElapsed;

  let lastCue=-1, lastTl=-1;
  const applyAt=(ms)=>{
    let ci=-1;
    P.cues.forEach((c,n)=>{ if(ms>=c.at) ci=n; });
    if(ci!==lastCue){ lastCue=ci; showProCaption(ci<0?null:P.cues[ci]); }
    if(P.scheduleAt){
      const n=P.scheduleAt.filter(at=>ms>=at).length;
      if(n!==lastTl){ lastTl=n; showProTimeline(n); }
    }
  };
  applyAt(proElapsed);

  const frame=()=>{
    if(proMode!=='playing') return;
    // 오디오가 실제로 흐르고 있으면 그것을 기준 시계로 쓴다
    const onAir = a && !a.paused && a.readyState>=2 && a.currentTime>0;
    if(onAir){
      proElapsed = Math.max(0, Math.min(total, a.currentTime*1000 - PRO_AT[pro]));
      proStarted = performance.now()-proElapsed;   // 오디오가 끊겨도 이어지도록
    } else {
      proElapsed = Math.min(total, performance.now()-proStarted);
    }
    applyAt(proElapsed);
    $('#proProgress').style.width=(proElapsed/total*100)+'%';
    $('#proTime').textContent=mmssShort(total-proElapsed);
    if(proElapsed>=total-40){
      if(pro<PROLOGUE.length-1){
        pro++; proElapsed=0; paintPro(); runProScene(); return;
      }
      proElapsed=total; proFinished=true; proMode='stopped'; clearProClock(); proAudioStop();
      $('#proProgress').style.width='100%'; $('#proTime').textContent='00:00'; updateProControls();
      startRound(0); return;
    }
    proFrame=requestAnimationFrame(frame);
  };
  frame();
}

function mmss(s){

function elapsedBefore(i){ return ROUNDS.slice(0,i).reduce((a,r)=>a+r.m,0); }

function startRound(i){

  ri=i; const r=ROUNDS[i];

        `<div><span class="ri">${ic}</span><span><b class="rt">${t}</b><span class="rdz">${d}</span></span></div>`).join('')}</div>`:'')
    + `<p>${r.s}</p>`

  $('#pause').textContent='일시정지';
  if(ONLINE) pushRound(i);

}
function paint(){
  const t=$('#timer'); t.textContent=mmss(left);
  t.classList.toggle('warn', left<=60 && left>30);

function splitCaption(sentence,max=58){
  const words=sentence.trim().split(/\s+/); const chunks=[]; let line='';
  words.forEach(word=>{
    if(line && (line+' '+word).length>max){ chunks.push(line); line=word; }
    else line+=(line?' ':'')+word;
  });
  if(line) chunks.push(line);
  return chunks;
}
function revealCues(r,index=rev){
  const sentences=(r.n||'').match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[];
  const parts=sentences.flatMap(s=>splitCaption(s)); const texts=[]; let bundle='';
  parts.forEach(part=>{
    const joined=bundle?bundle+' '+part:part;
    if(bundle&&joined.length>58){texts.push(bundle);bundle=part;}
    else bundle=joined;
    if(bundle.length>=44){texts.push(bundle);bundle='';}
  });
  if(bundle) texts.push(bundle);
  const manual=REVEAL_AUDIO[index]?.cueAt||[]; let cursor=RV_LEAD_MS;
  return texts.map((text,i)=>{
    const chars=text.replace(/\s/g,'').length;
    const dwell=Math.round(Math.max(5200,Math.min(9000,1600+chars*120+(text.match(/[,·—]/g)||[]).length*220))*RV_SCALE);
    const at=Number.isFinite(manual[i])?manual[i]:cursor;
    const nextManual=Number.isFinite(manual[i+1])?manual[i+1]:null;
    const duration=nextManual?Math.max(1800,nextManual-at-RV_GAP_MS):dwell;
    cursor=at+duration+RV_GAP_MS;
    return {text,at,duration};
  });
}
function captionLines(text){
  const words=text.trim().split(/\s+/).filter(Boolean); if(!words.length)return [];
  if(words.length===1){const cut=Math.ceil(words[0].length/2);return [words[0].slice(0,cut),words[0].slice(cut)].filter(Boolean);}
  const target=text.length/2; let best=1,bestDiff=Infinity,line='';
  for(let i=0;i<words.length-1;i++){
    line+=(line?' ':'')+words[i]; const diff=Math.abs(line.length-target);
    if(diff<bestDiff){bestDiff=diff;best=i+1;}
  }
  return [words.slice(0,best).join(' '),words.slice(best).join(' ')];
}
function revealDuration(r,index=rev){
  const cues=revealCues(r,index); const visual=cues.length?cues[cues.length-1].at+cues[cues.length-1].duration+RV_TAIL_MS:5000;
  const audio=REVEAL_AUDIO[index];
  return Math.max(visual,audio?.durationMs?RV_LEAD_MS+audio.durationMs+RV_TAIL_MS:0);
}
function clearRevealClock(){
  rvTimers.forEach(clearTimeout); rvTimers=[];
  if(rvFrame) cancelAnimationFrame(rvFrame); rvFrame=null;
  if(rvAudio){rvAudio.pause();rvAudio=null;}

}

  }
}
function mmssShort(ms){
  const total=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');
}
function updateRevealControls(){
  const play=$('#rvPlay'), prev=$('#rvPrev'); if(!play) return;
  prev.disabled=rev===0;
  play.setAttribute('aria-pressed',rvMode==='playing'?'true':'false');
  play.textContent=rvMode==='playing'?'Ⅱ 일시정지':rvFinished?'↻ 처음부터 재생':rvMode==='paused'?'▶ 계속 재생':'▶ 전체 재생';
  $('#rvPlayState').textContent=rvMode==='playing'?'자동 상영 중':rvMode==='paused'?'일시정지':rvFinished?'상영 완료':'재생 대기';
}
function startRevealAudio(offset){
  const cfg=REVEAL_AUDIO[rev]; if(!cfg?.src) return;
  const begin=()=>{
    if(rvMode!=='playing') return;
    rvAudio=new Audio(cfg.src); rvAudio.preload='auto';
    const audioOffset=Math.max(0,offset-RV_LEAD_MS);
    const playAudio=()=>{try{rvAudio.currentTime=audioOffset/1000;}catch(_){ } rvAudio.play().catch(()=>{});};
    if(rvAudio.readyState>=1) playAudio(); else rvAudio.addEventListener('loadedmetadata',playAudio,{once:true});
  };
  const wait=Math.max(0,RV_LEAD_MS-offset);
  if(wait) rvTimers.push(setTimeout(begin,wait)); else begin();
}
function runRevealScene(){
  clearRevealClock();
  const r=REVEAL[rev], cues=revealCues(r), total=revealDuration(r);
  const a=initRevAudio();
  const want=((REV_AT[rev]||0)+rvElapsed)/1000;
  const seek=()=>{ if(Math.abs(a.currentTime-want)>0.3){ try{ a.currentTime=want; }catch(e){} } };
  if(a.readyState>=1) seek(); else a.addEventListener('loadedmetadata', seek, {once:true});
  a.play().catch(()=>{});
  rvStarted=performance.now()-rvElapsed;

  let lastIdx=-2;
  const applyAt=(ms)=>{
    let ci=-1;
    cues.forEach((c,n)=>{ if(ms>=c.at) ci=n; });
    if(ci!==lastIdx){ lastIdx=ci; showRevealCaption(ci<0?'':cues[ci].text); }
  };

/* 캐릭터 QR — 매 판 순서를 섞어 랜덤 배정이 되게 한다.
   주소가 바뀌면 QR 을 다시 만들어야 하므로 현재 주소와 비교해 알려준다. */
function paintQR(){
  const box=$('#qrbox'); if(!box) return;
  const here=location.href.replace(/[^/]*$/,'');
  const stale = here.indexOf('://')>0 && here!==QR_BASE && !/^file:/.test(here);
  const order=[1,2,3,4].sort(()=>Math.random()-.5);
  box.innerHTML = `<div class="qrlab">각자 하나씩 스캔하세요 · 인물은 무작위입니다</div>
    <div class="qrgrid">${order.map((n,i)=>{
      const q=QR_DATA[n];
      return `<button class="qrc" data-qr="${n}">
        <svg viewBox="-2 -2 ${q.n+4} ${q.n+4}" shape-rendering="crispEdges">
          <rect x="-2" y="-2" width="${q.n+4}" height="${q.n+4}" fill="#fff"/>
          <path d="${q.d}" fill="#0f0b16"/></svg>
        <span>단말 ${'ABCD'[i]}</span></button>`;}).join('')}</div>
    ${stale?`<div class="qrwarn">이 QR 은 <b>${QR_BASE}</b> 기준입니다.<br>주소가 바뀌었다면 QR 을 다시 만들어주세요.</div>`:''}`;
  box.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.qr, q=QR_DATA[n];
    openModal(`<div class="qrpop">
      <svg viewBox="-2 -2 ${q.n+4} ${q.n+4}" shape-rendering="crispEdges">
        <rect x="-2" y="-2" width="${q.n+4}" height="${q.n+4}" fill="#fff"/>
        <path d="${q.d}" fill="#0f0b16"/></svg>
      <div class="qrurl">${QR_BASE}${n}.html</div>
      <button class="b1" onclick="closeModal()">닫기</button></div>`);
  });
}

function openModal(html){ $('#modal').innerHTML=html; $('#modal').classList.add('on'); $('#mbg').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); $('#mbg').classList.remove('on'); }
$('#gateGo').onclick=()=>startReveal();
$('#mbg').addEventListener('click',closeModal);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

let tt; function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2000); }

/* 이벤트 */
$('#go').addEventListener('click',()=>initProAudio());
$('#go').onclick = ()=>{
  bgmStart();
  pro=0;proElapsed=0;proFinished=false;proMode='playing';show('#s-pro');paintPro();runProScene();
};
$('#proPlay').onclick = ()=>{
  if(proMode==='playing'){
    proElapsed=Math.min(proDuration(),performance.now()-proStarted);proMode='paused';clearProClock();proAudioPause();updateProControls();return;
  }
  if(proFinished){pro=0;proElapsed=0;proFinished=false;paintPro();}
  proMode='playing';updateProControls();runProScene();
};
$('#proSkip').onclick = ()=>{
  proMode='stopped'; proFinished=true; clearProClock(); proAudioStop();
  startRound(0);
};
$('#proPrev').onclick = ()=>{
  if(pro<1)return;const playing=proMode==='playing';pro--;proElapsed=0;proFinished=false;paintPro();proAudioSync();if(playing)runProScene();
};
$('#pause').onclick = ()=>{ paused=!paused; $('#pause').textContent=paused?'계속하기':'일시정지'; };
$('#skip').onclick = ()=>{ clearInterval(tick); startRound(ri+1); };
$('#plus').onclick = ()=>{ left+=60; paint(); toast('1분 추가'); };
$('#rvPlay').onclick = ()=>{
  if(rvMode==='playing'){
    rvElapsed=performance.now()-rvStarted;rvMode='paused';clearRevealClock();updateRevealControls();return;
  }
  if(rvFinished){rev=0;rvElapsed=0;rvFinished=false;paintRev();}
  rvMode='playing';updateRevealControls();runRevealScene();
};
$('#rvSkip').onclick = ()=>{
  rvMode='stopped'; rvFinished=true; clearRevealClock(); revAudioStop();
  rev=REVEAL.length-1; rvElapsed=revealDuration(REVEAL[rev],rev); paintRev();
  $('#rvProgress').style.width='100%'; $('#rvTime').textContent='00:00'; updateRevealControls();
};
$('#rvPrev').onclick = ()=>{if(rev<1)return;const playing=rvMode==='playing';rev--;rvElapsed=0;rvFinished=false;paintRev();if(playing)runRevealScene();};
$('#tReset').onclick = ()=>{ bgmStop(); if(confirm('처음으로 돌아갑니다.')) location.reload(); };



$('#tSched').onclick = ()=>{
  openModal(`<h3>그날의 파티</h3>
    <div class="sub">모두가 알고 있는 공식 일정입니다</div>
    <div class="opts">${SCHEDULE.map(([t,x])=>
      `<div class="opt" style="cursor:default"><span style="font-family:var(--mono);color:var(--violet);width:52px">${t}</span><span>${x}</span></div>`).join('')}</div>
    <button class="b2" style="width:100%" onclick="document.getElementById('mbg').click()">닫기</button>`);
};
</script>
<script src="assets/visual-upgrade.js"></script>
<script>
/* 나레이션 미리 받아두기 · 캐릭터 QR 표시 */
try{ initProAudio(); }catch(e){ console.warn(e); }
try{ paintQR(); }catch(e){ console.warn(e); }
try{ initBgm(); paintBgmBtn();
     document.getElementById('bgmBtn').onclick=toggleBgm; }catch(e){ console.warn(e); }
</script>
