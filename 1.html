<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>현장 수사 단말 — 윤꽃집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#4593FC; --blue-d:#2E7CE8; --blue-l:#17304E; --blue-xl:#141F2E;
  --red:#FF5F6D; --red-l:#3B2026;
  --amber:#FFAA33; --amber-l:#3B2F16; --amber-d:#FFC470;
  --green:#22D18B; --green-l:#123528;
  --purple:#A78BFA; --purple-l:#2A2048;
  --w:#22242B;
  --g50:#141519; --g100:#1D1F26; --g200:#2E323B; --g300:#3E434E;
  --g400:#6B7280; --g500:#8B95A1; --g600:#A5ADB8; --g700:#C2C8D0;
  --g800:#DDE1E6; --g900:#F4F5F7;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0E1116;color:var(--g900);font-family:var(--sans);
  font-size:17px;line-height:1.62;letter-spacing:-.02em;
  display:flex;flex-direction:column;overflow-x:hidden}
#app{flex:1;display:flex;flex-direction:column;max-width:480px;width:100%;margin:0 auto;background:#0E1116}

/* ── 헤더 ── */
.hdr{position:sticky;top:0;z-index:30;background:rgba(14,17,22,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--g200);
  padding:14px 18px;display:flex;align-items:center;gap:12px}
.hdr .bk{background:none;border:0;color:var(--blue);font-size:16px;font-weight:700;
  cursor:pointer;padding:2px 0;visibility:hidden;font-family:var(--sans)}
.hdr .bk.on{visibility:visible}
.hdr .tt{font-size:19px;font-weight:800;flex:1;letter-spacing:-.03em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr .me{font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-l);
  border-radius:99px;padding:6px 13px;white-space:nowrap}
body.culprit .hdr .me{color:var(--red);background:var(--red-l)}

/* ── 탭 ── */
.tabs{position:sticky;top:57px;z-index:29;display:grid;grid-template-columns:repeat(3,1fr);
  background:rgba(14,17,22,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--g200)}
.tabs button{background:none;border:0;cursor:pointer;padding:15px 4px;
  font-family:var(--sans);font-size:16px;font-weight:600;color:var(--g500);transition:.15s}
.tabs button.on{color:var(--blue);font-weight:800;box-shadow:inset 0 -3px 0 var(--blue)}
.tabs .dt{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--red);margin-left:5px;vertical-align:3px}

main{flex:1;padding:18px 18px 110px}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;padding-bottom:2px}
.sub::-webkit-scrollbar{display:none}
.sub button{flex:0 0 auto;background:var(--w);border:1px solid var(--g200);cursor:pointer;
  border-radius:99px;padding:10px 17px;font-size:15px;font-weight:600;color:var(--g600);font-family:var(--sans)}
.sub button.on{background:var(--g900);border-color:var(--g900);color:#2B2E36;font-weight:700}

/* ── 카드 ── */
.c{background:var(--w);border-radius:20px;padding:20px 20px;margin-bottom:12px;box-shadow:var(--sh)}
.c.red{background:var(--red-l);box-shadow:none}
.c.amber{background:var(--amber-l);box-shadow:none}
.c.blue{background:var(--blue-l);box-shadow:none}
.c .lb{font-size:13px;font-weight:800;color:var(--blue);margin-bottom:9px;letter-spacing:0}
.c.red .lb{color:var(--red)} .c.amber .lb{color:var(--amber-d)}
.c h3{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:9px;line-height:1.35}
.c h4{font-size:18px;font-weight:800;margin:16px 0 7px;letter-spacing:-.02em}
.c h4:first-child{margin-top:0}
.c p{font-size:16.5px;line-height:1.7;color:var(--g700);margin-bottom:9px}
.c p:last-child{margin-bottom:0}
b{font-weight:800;color:var(--g900)}
.hl{font-weight:800;color:var(--red)}
.c ul{list-style:none;display:grid;gap:9px}
.c li{font-size:16px;line-height:1.65;color:var(--g700);padding-left:26px;position:relative}
.c li::before{content:'';position:absolute;left:8px;top:11px;width:5px;height:5px;
  border-radius:50%;background:var(--g300)}

/* ── 프로필 ── */
.prof{text-align:center;padding:26px 20px 22px}
.prof svg{width:112px;height:112px;margin:0 auto 14px;display:block}
.prof .pav{width:132px;height:132px;border-radius:24px;object-fit:cover;
  margin:0 auto 14px;display:block;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.prof .nm{font-size:30px;font-weight:800;letter-spacing:-.04em}
.prof .mt{font-size:15px;color:var(--g500);font-weight:600;margin-top:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.chips span{background:var(--g100);border-radius:99px;padding:8px 14px;
  font-size:14.5px;font-weight:700;color:var(--g700)}

/* 비밀 카드 */
.secret{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
  margin-bottom:12px;font-family:var(--sans);text-align:center}
.lock2{background:var(--w);border:2px dashed var(--g300);border-radius:20px;padding:30px 20px;
  box-shadow:none;transition:.15s}
.secret:active .lock2{transform:scale(.99)}
.lock2 .li{font-size:34px;margin-bottom:10px;opacity:.8}
.lock2 .lt{font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--g800)}
.lock2 .ld{font-size:14.5px;color:var(--g500);font-weight:600;margin-top:6px}

/* 판정 배너 */
.verd{border-radius:20px;padding:22px 20px;margin-bottom:12px;text-align:center}
.verd.bad{background:var(--red);color:#2B2E36}
.verd.ok{background:var(--blue);color:#0E1116}
.verd .ic{font-size:34px;margin-bottom:8px}
.verd h3{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px;color:#fff}
.verd p{font-size:17px;line-height:1.65;color:rgba(255,255,255,.96);margin-bottom:6px}
.verd p b{color:#2B2E36}
.verd .s{font-size:14px;color:rgba(255,255,255,.82);margin-top:12px;
  background:rgba(0,0,0,.18);border-radius:99px;padding:6px 14px;display:inline-block}

/* 대사 */
.say{background:#171A20;border-radius:16px;padding:18px 18px;
  font-size:17px;line-height:1.8;color:var(--g800);font-weight:500;position:relative}
.say::before{content:'“';position:absolute;left:12px;top:-4px;font-size:38px;color:var(--g300);font-weight:800}
.say{padding-left:34px}

/* 3줄 요약 */
.sum{display:grid;gap:8px;margin-bottom:12px}
.sum div{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;
  background:var(--w);border-radius:16px;padding:15px 16px;box-shadow:var(--sh);
  font-size:16.5px;font-weight:600;color:var(--g800)}
.sum b{background:var(--blue);color:#0E1116;border-radius:9px;text-align:center;
  font-family:var(--mono);font-size:14px;font-weight:700;padding:5px 0}
body.culprit .sum b{background:var(--red)}

/* 타임라인 */
.tl{display:grid;gap:0}
.tl .row{display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative;padding-bottom:12px}
.tl .row::before{content:'';position:absolute;left:63px;top:26px;bottom:0;width:2px;background:var(--g200)}
.tl .row:last-child::before{display:none}
.tl time{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--g500);
  text-align:right;padding-top:15px}
.tl .dot{position:absolute;left:59px;top:19px;width:10px;height:10px;border-radius:50%;
  background:var(--g300);border:2px solid var(--w);z-index:1}
.tl .row.key .dot{background:var(--red)}
.tl .bx{background:var(--w);border-radius:14px;padding:13px 15px;box-shadow:var(--sh);
  font-size:15.5px;line-height:1.6;color:var(--g700);margin-left:6px}
.tl .row.key .bx{background:var(--red-l);box-shadow:none;color:var(--g800)}
.tl .fake{background:var(--g100);border-radius:14px;padding:12px 15px;margin:6px 0 0 6px;
  font-size:14.5px;line-height:1.6;color:var(--g600)}
.tl .fake em{font-style:normal;display:block;font-size:12.5px;font-weight:800;
  color:var(--g500);margin-bottom:4px}

/* 추궁 */
.cri{background:var(--w);border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.cri .q{padding:17px 18px;font-size:17px;font-weight:800;color:var(--g900);
  cursor:pointer;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.cri .q .ar{margin-left:auto;color:var(--g400);font-size:15px;transition:.2s}
.cri.open .q .ar{transform:rotate(180deg)}
.cri .a{display:none;padding:0 18px 18px;font-size:15.5px;line-height:1.75;color:var(--g700)}
.cri.open .a{display:block}
.cri .a b{color:var(--g900)}

.plan{width:100%;height:auto;display:block;margin-bottom:14px}
.plan .ground{fill:var(--w);stroke:var(--g200);stroke-width:2}
.rm{cursor:pointer}
.rm .rr{fill:var(--g100);stroke:var(--g300);stroke-width:1.6;transition:.16s}
.rm:hover .rr,.rm:active .rr{fill:var(--blue-l);stroke:var(--blue);stroke-width:2.4}
.rm .rn{font-family:var(--sans);font-size:17px;font-weight:800;fill:var(--g900);
  text-anchor:middle;letter-spacing:-.02em}
.rm .rs{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--g500);text-anchor:middle}
.rm .bc{fill:var(--blue)}
.rm .bc.zero{fill:var(--g300)}
.rm .bt{font-family:var(--mono);font-size:13px;font-weight:700;fill:#0E1116;text-anchor:middle}
.plan .flow path{stroke:var(--amber);stroke-width:2.4;fill:none;stroke-linecap:round}
.plan .ft{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--amber);text-anchor:middle}
.plan .floornote{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--g500);text-anchor:middle}
.secthead{font-size:15px;font-weight:800;color:var(--g600);margin:18px 0 10px}
.secthead:first-of-type{margin-top:4px}
.keynote{background:var(--amber-l);border-radius:14px;padding:13px 16px;margin-bottom:12px;
  font-size:15px;font-weight:600;color:var(--amber-d);text-align:center}
.keynote b{color:var(--amber);font-weight:800}
.susart{background:var(--w);border-radius:20px;box-shadow:var(--sh);padding:24px;
  margin-bottom:12px;text-align:center}
.susart svg{width:88px;height:88px;margin:0 auto 10px;display:block}
.susart .pav{width:104px;height:104px;border-radius:20px;object-fit:cover;
  margin:0 auto 10px;display:block}
.susart .sn{font-size:24px;font-weight:800;letter-spacing:-.03em}
.susart .ss{font-size:14.5px;color:var(--g500);font-weight:600;margin-top:3px}
.oc .ct.zero{color:var(--g500)}
.rstat{display:flex;align-items:center;gap:12px;background:var(--w);border-radius:16px;
  padding:15px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.rstat .rl b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.rstat .rl span{font-size:13.5px;color:var(--g500);font-weight:600}
.rstat .pips{margin-left:auto;display:flex;gap:6px}
.rstat .pips i{width:14px;height:14px;border-radius:50%;background:var(--g200)}
.rstat .pips i.on{background:var(--blue)}
.done{background:var(--w);border-radius:20px;box-shadow:var(--sh);padding:26px 22px;
  text-align:center;margin-bottom:12px}
.done .ic{font-size:38px;margin-bottom:10px}
.done .wt{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.done .wd{font-size:15.5px;color:var(--g600);line-height:1.7;margin-bottom:16px}
.roomart{background:var(--w);border-radius:18px;box-shadow:var(--sh);padding:26px;
  margin-bottom:12px;display:flex;justify-content:center}
.roomart svg{width:104px;height:104px}
.bignum{font-family:var(--mono);font-size:46px;font-weight:700;color:var(--blue);
  letter-spacing:-.03em;margin:10px 0 6px;line-height:1}
.bignum span{font-family:var(--sans);font-size:15px;font-weight:600;color:var(--g500);
  letter-spacing:0;margin-left:6px}
.lockmsg{background:var(--g100);border-radius:14px;padding:15px;font-size:15px;
  color:var(--g500);font-weight:600;margin-top:10px}
.act .cnt{font-size:13.5px;font-weight:600;opacity:.75;margin-left:6px}
.newtag{text-align:center;font-size:14px;font-weight:800;color:var(--blue);
  background:var(--blue-l);border-radius:99px;padding:9px 0;margin-bottom:12px}
.rowbtn.empty{opacity:.45}
.rowbtn .ct.zero{color:var(--g500)}

/* ── 조사: 방 목록 ── */
.rooms{display:grid;gap:10px}
.rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--w);border:0;border-radius:18px;padding:16px 17px;box-shadow:var(--sh);
  font-family:var(--sans);transition:.15s}
.rowbtn:active{transform:scale(.99)}
.rowbtn .th{width:52px;height:52px;border-radius:14px;flex:0 0 auto;overflow:hidden;background:var(--g100)}
.rowbtn .th svg{width:100%;height:100%;display:block}
.rowbtn .th .pav{width:100%;height:100%;object-fit:cover;display:block}
.rowbtn .nm{font-size:18px;font-weight:800;color:var(--g900);letter-spacing:-.02em}
.rowbtn .s2{font-size:14px;color:var(--g500);font-weight:500;margin-top:2px}
.rowbtn .ct{margin-left:auto;font-family:var(--mono);font-size:14px;font-weight:700;color:var(--g400)}
.rowbtn .ct.done{color:var(--green)}
.rowbtn.me{background:var(--red-l);box-shadow:none}
.rowbtn.me .nm{color:var(--red)}

/* 장면 */
.scene{width:100%;height:auto;display:block;border-radius:18px;
  background:var(--w);box-shadow:var(--sh);margin-bottom:14px}
.flr{fill:#1D1F26}.wl{fill:none;stroke:#4B505B;stroke-width:2.5}
.fn{fill:#2B2E36;stroke:#646B78;stroke-width:1.8}
.lb2{font-family:var(--mono);font-size:9.5px;fill:#646B78;letter-spacing:.1em;text-anchor:middle}
.hs{cursor:pointer}
.hs .hit{fill:transparent}
.hs .ring{display:none}
.hs.static{cursor:default}
.hs.static .tip{display:none}
.hs:hover .ring,.hs:focus .ring{opacity:1}
.hs.done .ring{opacity:1;stroke:var(--green)}
.hs.done .shape{opacity:.4}
.hs .tip{font-family:var(--sans);font-size:11px;font-weight:700;fill:var(--blue);
  text-anchor:middle;opacity:0;transition:.2s}
.hs:hover .tip{opacity:1}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}
.hint2{text-align:center;font-size:14px;color:var(--g500);font-weight:600;margin-bottom:12px}

/* 오브젝트 그리드 */
.og{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oc{cursor:pointer;background:var(--w);border:0;border-radius:18px;padding:18px 12px;
  text-align:center;box-shadow:var(--sh);font-family:var(--sans);transition:.15s}
.oc:active{transform:scale(.98)}
.oc.done{background:var(--g100);box-shadow:none}
.oc svg{width:52px;height:52px;margin:0 auto 8px;display:block}
.oc .nm{font-size:16.5px;font-weight:800;color:var(--g900);letter-spacing:-.02em}
.oc .ct{font-size:13px;font-weight:600;color:var(--g400);margin-top:3px}
.oc.done .ct{color:var(--green)}

/* 단서 상세 */
.cimg{width:100%;height:auto;display:block;border-radius:16px;margin-bottom:14px;background:var(--g100)}
.cimg .hw{font-family:'Nanum Pen Script',cursive}
.cimg .anno{font-family:var(--sans);font-size:10px;font-weight:700}
.where{font-size:14px;color:var(--g500);font-weight:600;margin-bottom:12px}
.act{width:100%;cursor:pointer;margin-top:10px;border:0;border-radius:14px;padding:17px;
  font-family:var(--sans);font-size:17px;font-weight:700;background:var(--blue);color:#0E1116}
.act:active{transform:scale(.99)}
.act:disabled{background:var(--g100);color:var(--g400)}
.act.g{background:var(--w);border:1px solid var(--g200);color:var(--g700);font-weight:600}
.act.g.star{background:var(--amber-l);border-color:#FFE0B2;color:var(--amber-d)}

/* 영장 */
.warrant{background:var(--w);border-radius:22px;box-shadow:var(--sh);padding:34px 24px;text-align:center}
.warrant .ic{font-size:44px;margin-bottom:14px}
.warrant .wt{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:10px}
.warrant .wd{font-size:16px;color:var(--g600);line-height:1.75;margin-bottom:22px}
.warrant input{width:100%;background:var(--g100);border:2px solid transparent;border-radius:16px;
  padding:18px;font-family:var(--mono);font-size:26px;font-weight:700;text-align:center;
  letter-spacing:.36em;outline:none;color:var(--g900)}
.warrant input:focus{border-color:var(--blue);background:var(--w)}
.warrant .err{font-size:14.5px;color:var(--red);font-weight:600;margin-top:10px;min-height:20px}

/* 단서함 */
.vopts{display:grid;gap:10px;margin-bottom:14px}
.vopt{display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;
  background:var(--w);border:2px solid transparent;border-radius:18px;padding:16px 18px;
  box-shadow:var(--sh);font-family:var(--sans)}
.vopt.on{border-color:var(--blue);background:var(--blue-l)}
.vopt .va{width:46px;height:46px;flex:0 0 auto}
.vopt .va svg{width:100%;height:100%}
.vopt .va .pav{width:100%;height:100%;border-radius:12px;object-fit:cover;display:block}
.vopt .vnm{font-size:20px;font-weight:800;color:var(--g900);letter-spacing:-.02em}
.vopt .vck{margin-left:auto;font-size:20px;color:var(--blue);font-weight:800}
.vstat{text-align:center;font-size:16px;color:var(--g600);font-weight:600}
.vstat b{color:var(--blue);font-weight:800}
.kempty{text-align:center;color:var(--g500);font-size:16px;padding:70px 20px;line-height:1.9;font-weight:500}
.gh{display:flex;align-items:center;gap:9px;margin:20px 0 10px}
.gh:first-child{margin-top:0}
.gh .gt{font-size:15px;font-weight:800;color:var(--g900)}
.gh .gn{font-size:14px;font-weight:700;color:var(--g400)}
.ki{display:grid;grid-template-columns:26px 1fr;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--w);border:0;border-radius:16px;padding:15px 16px;margin-bottom:8px;
  box-shadow:var(--sh);font-family:var(--sans)}
.ki.st{background:var(--amber-l);box-shadow:none}
.ki .s{font-size:17px;color:var(--g300)}
.ki.st .s{color:var(--amber)}
.ki .n{display:block;font-size:17px;font-weight:800;color:var(--g900);letter-spacing:-.02em}
.ki .d{display:block;font-size:14.5px;color:var(--g600);line-height:1.6;margin-top:3px}

/* 하단 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:480px;margin:0 auto;
  background:rgba(14,17,22,.96);backdrop-filter:blur(14px);border-top:1px solid var(--g200);
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.dock .l{font-size:15px;font-weight:700;color:var(--g600)}
.dock .bg{font-family:var(--mono);font-size:15px;font-weight:700;color:#0E1116;
  background:var(--blue);border-radius:99px;padding:3px 12px}

#pop{position:fixed;inset:0;z-index:75;display:none}
#pop.on{display:block}
#pop .pbg{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(2px)}
#pop .pcd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(400px,calc(100vw - 32px));max-height:86vh;overflow-y:auto;
  background:var(--w);border-radius:22px;padding:22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pin .2s ease}
@keyframes pin{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#pop h3{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
#pop p{font-size:16.5px;line-height:1.7;color:var(--g700);margin-bottom:4px}
#pop .ptag{background:var(--blue-xl);border-radius:12px;padding:11px;text-align:center;
  font-size:14.5px;font-weight:700;color:var(--blue);margin-top:12px}
.sayadd{margin-top:14px;padding-top:14px;border-top:1px solid var(--g200);
  font-size:14.5px;line-height:1.7;color:var(--g600);font-weight:500}
.sayadd b{color:var(--g800);font-weight:800}
#gate{position:fixed;inset:0;z-index:80;background:#0E1116;
  display:flex;align-items:center;justify-content:center;padding:24px}
.gcard{width:100%;max-width:380px;text-align:center}
.gav{width:132px;height:132px;margin:0 auto 16px}
.gav svg{width:100%;height:100%}
.gav .pav{width:100%;height:100%;border-radius:22px;object-fit:cover;display:block;
  box-shadow:0 10px 30px rgba(0,0,0,.5)}
.gnm{font-size:30px;font-weight:800;letter-spacing:-.04em}
.gsub{font-size:15px;color:var(--g500);font-weight:600;margin-top:4px;margin-bottom:34px}
.gl{font-size:16px;color:var(--g600);font-weight:600;margin-bottom:12px}
.gl b{color:var(--g900)}
#gate input{width:100%;background:var(--w);border:2px solid var(--g200);border-radius:16px;
  padding:20px;font-family:var(--mono);font-size:34px;font-weight:700;text-align:center;
  letter-spacing:.3em;color:var(--g900);outline:none;text-transform:uppercase}
#gate input:focus{border-color:var(--blue)}
.gerr{font-size:14.5px;color:var(--red);font-weight:600;min-height:22px;margin-top:8px}
.dock .net{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);
  background:var(--blue-l);border-radius:8px;padding:3px 9px;margin-left:auto}
.dock .net.off{color:var(--amber);background:var(--amber-l)}
.dock .r{margin-left:10px;font-size:13px;color:var(--g500);font-weight:600;
  max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);z-index:70;
  background:var(--g900);color:#0E1116;font-size:15.5px;font-weight:600;
  padding:13px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:.24s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* 결정적 증거 — 1차 조사에서는 나오지 않는다 */
const KEY_CLUES=new Set(['ice','water','memo','mold','awl','dry','plan','cyan']);

/* 본인이 뽑을 수 없는 단서
   자기 공간은 조사할 수 있지만, 진범이 쥐면 게임이 막히는 것만 막는다.
   얼음틀은 트릭 전체의 출발점이라 진범 손에 들어가면 안 된다. */
const BLOCK_BY={ yun:['mold'], han:[], bak:[], yu:[] };

/* 모든 조사 장소를 한 곳에 모은다 */
const LOC={};
Object.entries(PLACES).forEach(([k,p])=>{
  LOC['site:'+k]={key:'site:'+k, zone:'site', name:p.n, sub:p.s, ic:p.ic, room:k, clues:p.clues};
});
Object.entries(SUSPECTS).forEach(([k,s])=>{
  s.spaces.forEach((sp,i)=>{
    LOC[`sus:${k}:${i}`]={key:`sus:${k}:${i}`, zone:'sus', owner:k,
      name:sp.n, sub:s.n, ic:sp.ic, room:k, clues:sp.clues};

});

/* 오프라인용 배분 — 서버가 없을 때만 쓴다 */
const ORDER=['han','bak','yu','yun'];
const MYKEY='yun';
const SEED=20260821;
function rnd(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuf(arr,seed){ const r=rnd(seed), a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function keyNum(k){ let n=0; for(const c of k) n=(n*131+c.charCodeAt(0))>>>0; return n; }
function buildDeal(){
  const hand={han:[],bak:[],yu:[],yun:[]};
  const site=[], sus={};
  Object.values(LOC).forEach(l=>l.clues.forEach(c=>{
    if(l.zone==='site') site.push({c,loc:l.key,room:l.room});
    else (sus[l.owner]=sus[l.owner]||[]).push({c,loc:l.key,room:l.room});
  }));
  shuf(site,SEED).forEach((x,i)=>{
    const pool=ORDER.filter(k=>!(BLOCK_BY[k]||[]).includes(x.c));
    hand[pool[i%pool.length]].push(x);
  });
  Object.entries(sus).forEach(([sk,arr])=>{
    shuf(arr, SEED+keyNum(sk)).forEach((x,i)=>{
      // 특정 인물이 못 갖는 단서는 그 사람을 빼고 돌린다
      const pool=ORDER.filter(k=>!(BLOCK_BY[k]||[]).includes(x.c));
      hand[pool[i%pool.length]].push(x);
    });
  });
  const seq={};
  ORDER.forEach(k=>{
    const nk=shuf(hand[k].filter(x=>!KEY_CLUES.has(x.c)), SEED+keyNum(k)+7);
    const kk=shuf(hand[k].filter(x=>KEY_CLUES.has(x.c)),  SEED+keyNum(k)+13);
    const all=[...nk.slice(0,3), ...kk, ...nk.slice(3)];   // 1차는 비핵심만
    seq[k]=[all.slice(0,3), all.slice(3,6), all.slice(6,9)];
  });
  return seq;
}
const DEAL=buildDeal();

/* 지금까지 테이블 전체에서 빠져나간 단서 (네 명이 같은 속도로 뽑는다고 본다) */
function goneSet(round, step){
  const g=new Set();
  ORDER.forEach(k=>{
    for(let r=0;r<round-1;r++) DEAL[k][r].forEach(x=>g.add(x.c));
    DEAL[k][round-1].slice(0,step).forEach(x=>g.add(x.c));
  });
  return g;
}

function joinRoom(code, ok, fail){
  ROOM=code.toUpperCase();
  try{ sessionStorage.setItem('mmRoom', ROOM); }catch(e){}
  roomRef('at').once('value').then(s=>{
    if(!s.exists()){ fail('그런 방이 없습니다'); return; }
    ONLINE=true;
    roomRef('taken').on('value', s=>{ taken=s.val()||{}; restoreMine(); if(tab==='inv') render(); dockNet(); });
    roomRef('round').on('value', s=>{
      const r=s.val()||0;
      if(r && r!==srvRound){ srvRound=r; round=r; nav=[];
        if(r>=2) susOpen=true;
        restoreMine();
        toast(`${ROUND_NAME[r]}가 시작되었습니다`); if(tab==='inv') render(); }
      srvRound=r; dockNet();
    });
    roomRef('phase').on('value', s=>{ srvPhase=s.val()||''; dockNet(); });
    roomRef('vote').on('value', s=>{ srvVote=s.val()||0; render(); });
    roomRef('votes').on('value', s=>{ myVotes=s.val()||{}; if(srvVote) render(); });
    ok();
  }).catch(()=>fail('연결에 실패했습니다'));
}

/* 단서 선점 — 먼저 쓴 사람이 가져간다 */
function claim(id, done){
  if(!ONLINE){ done(true); return; }
  // "누가" 뿐 아니라 "몇 차 조사에서" 가져갔는지도 남긴다 → 새로고침 복구에 쓰인다
  roomRef('taken/'+id).transaction(
    cur => (cur===null ? MYKEY+'#'+round : undefined),
    (err, committed) => { committed ? done(true) : done(false); },
    false
  );
}

/* 서버 기록으로 내 단서함과 이번 라운드 조사 횟수를 되살린다.
   새로고침·앱 종료 후 다시 들어와도 그대로 이어진다. */
function locOfClue(c){
  for(const k in LOC) if(LOC[k].clues.includes(c)) return k;
  return null;
}
function restoreMine(){
  if(!ONLINE) return;
  found.clear(); roundDraw=[];
  Object.entries(taken).forEach(([c,v])=>{
    const [who,r] = String(v).split('#');
    if(who!==MYKEY) return;
    found.add(c);
    if(Number(r)===round) roundDraw.push({c, loc:locOfClue(c)});
  });
  dock();
}

/* ── 조사 ── */
function canDraw(c){ return round>=2 || !KEY_CLUES.has(c); }

const MY_BLOCK = new Set(BLOCK_BY[MYKEY] || []);
function poolAt(key){
  const l=LOC[key];
  if(ONLINE) return l.clues.filter(c=>!taken[c] && canDraw(c) && !MY_BLOCK.has(c));
  return (DEAL[MYKEY][round-1]||[]).filter(x=>x.loc===key && !found.has(x.c) && !MY_BLOCK.has(x.c));
}
function leftAt(key){
  const l=LOC[key];
  if(ONLINE) return l.clues.filter(c=>!taken[c]).length;
  let gone=0;
  ORDER.forEach(k=>{ for(let r=0;r<round-1;r++) gone+=DEAL[k][r].filter(x=>x.loc===key).length; });
  gone += roundDraw.filter(x=>x.loc===key).length;
  return Math.max(0, l.clues.length-gone);
}

function rInv(){
  if(nav.length===0){ rMap(); return; }
  const top=nav[nav.length-1];
  if(top.t==='loc') rLoc(top.k);
  else if(top.t==='sus') rSus(top.k);
  else rClue(top);
}

function rLoc(key){
  const l=LOC[key]; $('#tt').textContent=l.name;
  const n=leftAt(key), left=drawsLeft(), mine=poolAt(key);
  const own = l.zone==='sus' && l.owner===MYKEY;
  let h = (l.zone==='site'&&SCENES[l.room]) ? SCENES[l.room]()
        : `<div class="roomart">${IC[l.ic]||''}</div>`;
  h += `<div class="c" style="text-align:center">

      : `<button class="act" id="dig">여기를 조사한다 <span class="cnt">${left}회 남음</span></button>`}

  if($('#dig')) $('#dig').onclick=()=>tryDig(key,0);
}

function tryDig(key,attempt){
  const pool=poolAt(key);
  if(!pool.length || attempt>4){ emptyDig(key); return; }
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const id = ONLINE ? pick : pick.c;
  const btn=$('#dig'); if(btn){ btn.disabled=true; btn.textContent='조사 중…'; }
  claim(id, ok=>{
    if(!ok){ tryDig(key,attempt+1); return; }
    found.add(id); roundDraw.push({c:id, loc:key}); dock();
    nav=[{t:'clue',c:id,back:key}]; render();
  });
}

  $('#gc').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  $('#gof').onclick=()=>{ ONLINE=false; document.getElementById('gate').style.display='none';
    render(); dock(); dockNet(); toast('오프라인 모드로 시작합니다'); };

  // 같은 탭에서 새로고침한 경우 자동으로 다시 들어간다
  const saved = (()=>{ try{ return sessionStorage.getItem('mmRoom'); }catch(e){ return null; } })();
  if(saved && netReady && !url){
    $('#gc').value=saved; $('#gg').disabled=true; $('#gg').textContent='다시 연결 중…';
    joinRoom(saved, ()=>{ document.getElementById('gate').style.display='none';
        render(); dock(); dockNet(); toast('이어서 진행합니다'); },
      ()=>{ try{ sessionStorage.removeItem('mmRoom'); }catch(e){}
        $('#gg').disabled=false; $('#gg').textContent='입장하기'; $('#gc').value=''; });
  }
}
showGate();
render(); dock();
</script>
</body>
</html>
